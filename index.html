<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nann Official · Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 30% 20%, #0a0a12, #020205);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .container { max-width: 450px; width: 100%; }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #e8d5b0, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p { color: rgba(255,255,245,0.6); font-size: 0.8rem; }
        .card {
            background: rgba(10,10,20,0.6);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 2rem;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: rgba(255,255,245,0.7);
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            width: 100%;
            padding: 0.9rem;
            padding-right: 3rem;
            border-radius: 60px;
            border: 1px solid rgba(212,175,55,0.4);
            background: rgba(20,20,35,0.8);
            color: white;
            font-size: 0.9rem;
        }
        .password-wrapper input:focus { outline: none; border-color: #d4af37; }
        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: rgba(255,255,245,0.6);
            font-size: 1rem;
        }
        input[type="text"], select {
            width: 100%;
            padding: 0.9rem;
            border-radius: 60px;
            border: 1px solid rgba(212,175,55,0.4);
            background: rgba(20,20,35,0.8);
            color: white;
            font-size: 0.9rem;
        }
        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #1a1508;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: #ff6b6b;
        }
        .link-register {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: rgba(255,255,245,0.6);
        }
        .link-register a {
            color: #d4af37;
            cursor: pointer;
            text-decoration: none;
        }
        .info-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: rgba(255,255,245,0.4);
        }
        @media (max-width: 480px) {
            .card { padding: 1.5rem; }
            .logo h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>✨ NANN OFFICIAL ✨</h1>
            <p>Luxury Digital Marketplace</p>
        </div>
        <div class="card">
            <!-- Form Login -->
            <div id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Masukkan username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="Masukkan password">
                        <i class="fas fa-eye toggle-password" data-target="loginPassword"></i>
                    </div>
                </div>
                <button class="btn-submit" id="loginBtn">Login</button>
                <div class="link-register">
                    Belum punya akun? <a id="showRegister">Daftar di sini</a>
                </div>
            </div>

            <!-- Form Register (hidden by default) -->
            <div id="registerForm" style="display:none;">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Masukkan username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" placeholder="Masukkan password (min 4 karakter)">
                        <i class="fas fa-eye toggle-password" data-target="regPassword"></i>
                    </div>
                </div>
                <button class="btn-submit" id="registerBtn">Daftar</button>
                <div class="link-register">
                    Sudah punya akun? <a id="showLogin">Login di sini</a>
                </div>
            </div>

            <div id="message" class="message"></div>
            <div class="info-text">
                <i class="fas fa-shield-alt"></i> Data tersimpan di browser Anda
            </div>
        </div>
    </div>

    <script>
        // Toggle password
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (input.type === 'password') {
                    input.type = 'text';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                }
            });
        });
        
        // Inisialisasi data default
        function initData() {
            // Akun Owner (dynan / 257368419)
            if (!localStorage.getItem('users')) {
                const defaultUsers = [
                    { id: 1, username: 'dynan', password: btoa('257368419'), role: 'owner', saldo: 0 }
                ];
                localStorage.setItem('users', JSON.stringify(defaultUsers));
            }
            
            // Produk default
            if (!localStorage.getItem('products')) {
                const defaultProducts = [
                    { id: 1, name: '🤖 JASA JADI BOT WHATSAPP', price: 1000, benefit: 'JADI OWNER BOT, BISA OPEN JASA SEWA BOT, PAKE BOT SEPUASNYA, FITUR 1500+, ANTI DELAY' },
                    { id: 2, name: '🎬 ALIGHT MOTION PREMIUM', price: 10000, benefit: 'AKUN PRIVATE, PREMIUM UNLIMITED, DURASI 1 TAHUN, NO EXPORT WATERMARK, ALL FITUR PRO' },
                    { id: 3, name: '🥚 NOKOS INDON OLD', price: 10000, benefit: 'VERSI OLD LIMITED, PREMIUM ACCESS, STABLE VERSION' },
                    { id: 4, name: '🥚 NOKOS INDON FRESH', price: 6000, benefit: 'VERSI FRESH UPDATE, PREMIUM ACCESS, FULL SUPPORT' }
                ];
                localStorage.setItem('products', JSON.stringify(defaultProducts));
            }
            
            if (!localStorage.getItem('topup_requests')) {
                localStorage.setItem('topup_requests', JSON.stringify([]));
            }
            if (!localStorage.getItem('transactions')) {
                localStorage.setItem('transactions', JSON.stringify([]));
            }
        }
        initData();
        
        // Toggle form
        document.getElementById('showRegister').onclick = () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('message').innerHTML = '';
        };
        document.getElementById('showLogin').onclick = () => {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('message').innerHTML = '';
        };
        
        // LOGIN
        document.getElementById('loginBtn').onclick = () => {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                document.getElementById('message').innerHTML = 'Isi username dan password!';
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('users'));
            const user = users.find(u => u.username === username && atob(u.password) === password);
            
            if (!user) {
                document.getElementById('message').innerHTML = 'Username atau password salah!';
                return;
            }
            
            localStorage.setItem('currentUser', JSON.stringify({ id: user.id, username: user.username, role: user.role, saldo: user.saldo }));
            
            if (user.role === 'owner') {
                window.location.href = 'owner.html';
            } else {
                window.location.href = 'member.html';
            }
        };
        
        // REGISTER (hanya member)
        document.getElementById('registerBtn').onclick = () => {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            
            if (!username || !password) {
                document.getElementById('message').innerHTML = 'Isi semua field!';
                return;
            }
            if (password.length < 4) {
                document.getElementById('message').innerHTML = 'Password minimal 4 karakter!';
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('users'));
            if (users.find(u => u.username === username)) {
                document.getElementById('message').innerHTML = 'Username sudah terdaftar!';
                return;
            }
            
            const newId = users.length + 1;
            const newUser = {
                id: newId,
                username: username,
                password: btoa(password),
                role: 'member',
                saldo: 0
            };
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            
            document.getElementById('message').innerHTML = '✅ Registrasi berhasil! Silakan login.';
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            
            setTimeout(() => {
                document.getElementById('showLogin').click();
            }, 1500);
        };
    </script>
</body>
</html>
