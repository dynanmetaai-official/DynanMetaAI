<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>NANN META AI · DeepSeek</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0a0f1f, #03060e);
      font-family: system-ui, 'Segoe UI', 'Inter', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    /* wadah utama — mirip screen HP */
    .ai-container {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      background: rgba(15, 22, 36, 0.65);
      backdrop-filter: blur(20px);
      border-radius: 48px 48px 32px 32px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(72, 187, 255, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 85vh;
      max-height: 780px;
      transition: all 0.2s ease;
    }

    /* header dengan gradien futuristik */
    .ai-header {
      padding: 20px 22px 12px 22px;
      background: linear-gradient(135deg, rgba(10, 20, 40, 0.9) 0%, rgba(5, 12, 24, 0.95) 100%);
      border-bottom: 1px solid rgba(0, 255, 255, 0.25);
      text-align: center;
    }

    .ai-header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(120deg, #ffffff, #88ddff, #6a9eff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 2px 3px rgba(0,0,0,0.2);
    }

    .badge-version {
      display: inline-block;
      background: rgba(0, 212, 255, 0.2);
      backdrop-filter: blur(4px);
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: 40px;
      margin-top: 6px;
      color: #aaf0ff;
      border: 0.5px solid rgba(100, 200, 255, 0.5);
      font-weight: 500;
    }

    /* area chat — scroll halus */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* custom scroll */
    .chat-area::-webkit-scrollbar {
      width: 4px;
    }
    .chat-area::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-area::-webkit-scrollbar-thumb {
      background: #2c5a7a;
      border-radius: 10px;
    }

    /* bubble umum */
    .message {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      max-width: 90%;
      animation: fadeSlideUp 0.25s ease-out;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user-message {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .bot-message {
      align-self: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(4px);
      flex-shrink: 0;
    }

    .user-message .avatar {
      background: linear-gradient(145deg, #1f3b4c, #0c1e2a);
      border: 0.5px solid #3ec1ff;
    }

    .bot-message .avatar {
      background: linear-gradient(145deg, #162b3a, #0a1620);
      border: 0.5px solid #94e0ff;
      box-shadow: 0 0 6px rgba(0,200,255,0.3);
    }

    .bubble {
      background: rgba(22, 32, 48, 0.8);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 12px 18px;
      font-size: 0.95rem;
      line-height: 1.45;
      color: #f0f3fa;
      word-break: break-word;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      border: 0.5px solid rgba(120, 200, 255, 0.2);
    }

    .user-message .bubble {
      background: linear-gradient(135deg, #1f3a5f, #10263f);
      border-bottom-right-radius: 10px;
      color: white;
    }

    .bot-message .bubble {
      background: rgba(12, 22, 35, 0.85);
      border-bottom-left-radius: 10px;
      border-left: 2px solid #2bc0ff;
    }

    /* loading dot animasi */
    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      background: rgba(18, 28, 40, 0.8);
      border-radius: 40px;
      width: fit-content;
      backdrop-filter: blur(8px);
    }
    .typing-dot {
      width: 8px;
      height: 8px;
      background: #8bcbff;
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 60%, 100% { transform: scale(0.6); opacity: 0.5; }
      30% { transform: scale(1.1); opacity: 1; }
    }

    /* input area */
    .input-area {
      background: rgba(10, 18, 28, 0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(64, 164, 215, 0.3);
      padding: 14px 18px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .input-wrapper {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 44px;
      border: 1px solid rgba(66, 192, 255, 0.5);
      display: flex;
      align-items: center;
      padding: 4px 8px 4px 18px;
      transition: all 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: #3ebcff;
      box-shadow: 0 0 0 2px rgba(62, 188, 255, 0.3);
    }

    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 6px 12px 0;
      font-size: 1rem;
      color: #eff3ff;
      outline: none;
      font-weight: 500;
    }
    #userInput::placeholder {
      color: #8fabc3;
      font-weight: 400;
    }

    #sendBtn {
      background: linear-gradient(120deg, #1877c2, #0e5a8e);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 2px 10px rgba(0,160,255,0.3);
    }
    #sendBtn:active { transform: scale(0.94); opacity: 0.9; }
    #sendBtn svg {
      width: 22px;
      height: 22px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    /* pesan error/info kecil */
    .info-note {
      text-align: center;
      font-size: 0.7rem;
      padding: 8px;
      color: #93b5cf;
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      margin: 6px 12px;
    }

    button:active, .btn-reset:active {
      transform: scale(0.96);
    }

    /* reset kecil */
    .reset-btn {
      background: transparent;
      border: none;
      color: #aaf0ff;
      margin-left: 8px;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
    }
  </style>
</head>
<body>

<div class="ai-container">
  <div class="ai-header">
    <h1>⚡ NANN META AI</h1>
    <div class="badge-version">DeepSeek R1 · 24B/7B</div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="message bot-message">
      <div class="avatar">🌀</div>
      <div class="bubble">Halo! Saya <strong>NANN META AI</strong>, berbasis DeepSeek. Tanyakan apa saja, dan aku akan menjawab sebaik mungkin. ✨</div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <input type="text" id="userInput" placeholder="Tanya NANN META AI..." autocomplete="off" enterkeyhint="send">
    </div>
    <button id="sendBtn" aria-label="Kirim pesan">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <div class="info-note">
    🧠 DeepSeek API | Sepenuhnya responsif
  </div>
</div>

<script>
  // ======================= 🔐 API KEY DEEPSEEK =======================
  // GANTI DENGAN API KEY DEEPSEEK ANDA! (Disimpan di variabel)
  // 🔻🔻🔻 PASTIKAN API KEY VALID 🔻🔻🔻
  const DEEPSEEK_API_KEY = "sk-4e2a3f1c7d9b8a5e6f7c8b9a0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f";  
  // ↑↑↑ gunakan API key nyata dari platform.deepseek.com ↑↑↑
  // Catatan: contoh key diatas adalah dummy, anda harus mengganti dengan key asli.
  
  const API_URL = "https://api.deepseek.com/v1/chat/completions";
  
  // Elemen DOM
  const chatArea = document.getElementById('chatArea');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  
  // State
  let isLoading = false;
  
  // Fungsi scroll otomatis ke bawah
  function scrollToBottom() {
    setTimeout(() => {
      chatArea.scrollTo({
        top: chatArea.scrollHeight,
        behavior: 'smooth'
      });
    }, 50);
  }
  
  // Menampilkan pesan di chat
  function addMessage(role, content) {
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message');
    if (role === 'user') {
      messageDiv.classList.add('user-message');
    } else {
      messageDiv.classList.add('bot-message');
    }
    
    const avatarSpan = document.createElement('div');
    avatarSpan.classList.add('avatar');
    avatarSpan.innerText = role === 'user' ? '👤' : '🌀';
    
    const bubbleDiv = document.createElement('div');
    bubbleDiv.classList.add('bubble');
    // support newline dan markdown sederhana
    bubbleDiv.innerHTML = content.replace(/\n/g, '<br>');
    
    messageDiv.appendChild(avatarSpan);
    messageDiv.appendChild(bubbleDiv);
    chatArea.appendChild(messageDiv);
    scrollToBottom();
    return messageDiv;
  }
  
  // Menampilkan indikator mengetik (loading)
  let typingIndicatorDiv = null;
  function showTypingIndicator() {
    removeTypingIndicator();
    const loaderWrap = document.createElement('div');
    loaderWrap.classList.add('message', 'bot-message');
    const avatarSpan = document.createElement('div');
    avatarSpan.classList.add('avatar');
    avatarSpan.innerText = '🌀';
    const bubbleLoader = document.createElement('div');
    bubbleLoader.classList.add('typing-indicator');
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('div');
      dot.classList.add('typing-dot');
      bubbleLoader.appendChild(dot);
    }
    loaderWrap.appendChild(avatarSpan);
    loaderWrap.appendChild(bubbleLoader);
    chatArea.appendChild(loaderWrap);
    typingIndicatorDiv = loaderWrap;
    scrollToBottom();
  }
  
  function removeTypingIndicator() {
    if (typingIndicatorDiv && typingIndicatorDiv.parentNode) {
      typingIndicatorDiv.remove();
      typingIndicatorDiv = null;
    }
  }
  
  // Fungsi panggil DeepSeek API
  async function askDeepSeek(userQuestion) {
    if (!DEEPSEEK_API_KEY || DEEPSEEK_API_KEY === "sk-4e2a3f1c7d9b8a5e6f7c8b9a0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f") {
      return "⚠️ **API Key belum diatur dengan benar** ⚠️\n\nSilakan ganti variabel `DEEPSEEK_API_KEY` dengan kunci API asli dari DeepSeek. (Dapatkan di platform.deepseek.com)";
    }
    
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
        },
        body: JSON.stringify({
          model: "deepseek-chat",  // model deepseek terbaru
          messages: [
            { role: "system", content: "Kamu adalah NANN META AI, asisten cerdas yang ramah, informatif, dan menggunakan bahasa Indonesia yang natural. Jawab pertanyaan dengan tepat, jelas, dan ringkas. Jika ditanya hal di luar pengetahuan, akui dengan jujur." },
            { role: "user", content: userQuestion }
          ],
          temperature: 0.7,
          max_tokens: 800,
          top_p: 0.95,
          stream: false
        })
      });
      
      if (!response.ok) {
        let errorDetail = `HTTP ${response.status}`;
        try {
          const errData = await response.json();
          errorDetail = errData.error?.message || JSON.stringify(errData);
        } catch(e) {}
        throw new Error(`API error: ${errorDetail}`);
      }
      
      const data = await response.json();
      if (data && data.choices && data.choices.length > 0) {
        let reply = data.choices[0].message.content;
        // sedikit filter untuk tampilan
        return reply.trim();
      } else {
        return "Maaf, saya tidak mendapatkan respons yang valid dari server. Coba lagi ya.";
      }
    } catch (error) {
      console.error("DeepSeek API Error:", error);
      let errorMsg = "❌ **Gagal terhubung ke NANN META AI** ❌\n\n";
      if (error.message.includes("API key")) {
        errorMsg += "API Key tidak valid atau belum diset. Periksa kembali kunci DeepSeek Anda.";
      } else if (error.message.includes("fetch")) {
        errorMsg += "Cek koneksi internet atau CORS. Pastikan API key benar dan endpoint aktif.";
      } else {
        errorMsg += `Detail: ${error.message.substring(0, 150)}`;
      }
      return errorMsg;
    }
  }
  
  // Proses pengiriman pesan
  async function sendMessage() {
    if (isLoading) return;
    const question = userInput.value.trim();
    if (!question) return;
    
    // disable input selama proses
    isLoading = true;
    sendBtn.disabled = true;
    userInput.disabled = true;
    
    // 1. tampilkan pesan user
    addMessage('user', question);
    userInput.value = '';
    
    // 2. tampilkan indikator mengetik AI
    showTypingIndicator();
    
    // 3. panggil API
    const aiAnswer = await askDeepSeek(question);
    
    // 4. hapus indicator
    removeTypingIndicator();
    
    // 5. tampilkan jawaban bot
    addMessage('bot', aiAnswer);
    
    // re-enable
    isLoading = false;
    sendBtn.disabled = false;
    userInput.disabled = false;
    userInput.focus();
  }
  
  // event handler
  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !isLoading) {
      e.preventDefault();
      sendMessage();
    }
  });
  
  // Optional: Hapus Chat (karena tidak ada tombol reset, tapi pengguna bisa refresh atau tambahan kecil)
  // tambahkan fitur reset dengan double tap header?  biar clean. Di info-note bisa klik reset ringan
  // Saya tambahkan reset ringan tanpa reload halaman (opsional)
  const headerEl = document.querySelector('.ai-header');
  let resetToast = false;
  headerEl.addEventListener('dblclick', () => {
    if (confirm('🗑️ Reset semua percakapan? (Chat akan dikosongkan)')){
      // Hapus semua pesan kecuali pesan sambutan awal pertama
      while(chatArea.children.length > 0) {
        chatArea.removeChild(chatArea.firstChild);
      }
      // tambahkan pesan bot fresh
      const welcomeMsg = document.createElement('div');
      welcomeMsg.classList.add('message', 'bot-message');
      welcomeMsg.innerHTML = `<div class="avatar">🌀</div><div class="bubble">Halo! Saya <strong>NANN META AI</strong>, berbasis DeepSeek. Tanyakan apa saja, dan aku akan menjawab sebaik mungkin. ✨</div>`;
      chatArea.appendChild(welcomeMsg);
      scrollToBottom();
      // hapus indikator loading jika ada
      removeTypingIndicator();
      isLoading = false;
      sendBtn.disabled = false;
      userInput.disabled = false;
    }
  });
  
  // cegah error kirim saat loading selesai api key dummy
  window.addEventListener('load', () => {
    // jika API key masih dummy tampilkan peringatan di console dan catatan di chat? bisa tambahkan pesan hati2
    if (DEEPSEEK_API_KEY === "sk-4e2a3f1c7d9b8a5e6f7c8b9a0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f") {
      const warnMsg = document.createElement('div');
      warnMsg.classList.add('message', 'bot-message');
      warnMsg.innerHTML = `<div class="avatar">⚠️</div><div class="bubble" style="background:#2a1f1f; border-left-color:#ff9966;"><strong>Perhatian:</strong> API Key DeepSeek belum diganti! <br>📍 Ganti variabel <code style="background:#00000066; padding:2px 6px; border-radius:12px;">DEEPSEEK_API_KEY</code> dengan key asli dari platform.deepseek.com agar AI bisa menjawab dengan sempurna. 🔑</div>`;
      chatArea.appendChild(warnMsg);
      scrollToBottom();
    }
  });
  
  // Auto-focus dan atur tinggi area agar tetap nyaman di hp
  userInput.focus();
  // optional: menangani saat keyboard mobile, scroll ke bawah tetap aman
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      scrollToBottom();
    }, 150);
  });
</script>
</body>
</html>
```
