<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>NANN META AI · GEMINI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0a0f1f, #03060e);
      font-family: system-ui, 'Segoe UI', 'Inter', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .ai-container {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      background: rgba(15, 22, 36, 0.65);
      backdrop-filter: blur(20px);
      border-radius: 48px 48px 32px 32px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(72, 187, 255, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 85vh;
      max-height: 780px;
    }

    .ai-header {
      padding: 20px 22px 12px 22px;
      background: linear-gradient(135deg, rgba(10, 20, 40, 0.9) 0%, rgba(5, 12, 24, 0.95) 100%);
      border-bottom: 1px solid rgba(0, 255, 255, 0.25);
      text-align: center;
    }

    .ai-header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      background: linear-gradient(120deg, #ffffff, #88ddff, #6a9eff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .badge-version {
      display: inline-block;
      background: rgba(0, 212, 255, 0.2);
      backdrop-filter: blur(4px);
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: 40px;
      margin-top: 6px;
      color: #aaf0ff;
      border: 0.5px solid rgba(100, 200, 255, 0.5);
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar {
      width: 4px;
    }
    .chat-area::-webkit-scrollbar-thumb {
      background: #2c5a7a;
      border-radius: 10px;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      max-width: 90%;
      animation: fadeSlideUp 0.25s ease-out;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user-message {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .bot-message {
      align-self: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(4px);
      flex-shrink: 0;
    }

    .user-message .avatar {
      background: linear-gradient(145deg, #1f3b4c, #0c1e2a);
      border: 0.5px solid #3ec1ff;
    }

    .bot-message .avatar {
      background: linear-gradient(145deg, #162b3a, #0a1620);
      border: 0.5px solid #94e0ff;
    }

    .bubble {
      background: rgba(22, 32, 48, 0.8);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 12px 18px;
      font-size: 0.95rem;
      line-height: 1.45;
      color: #f0f3fa;
      word-break: break-word;
      border: 0.5px solid rgba(120, 200, 255, 0.2);
    }

    .user-message .bubble {
      background: linear-gradient(135deg, #1f3a5f, #10263f);
      border-bottom-right-radius: 10px;
    }

    .bot-message .bubble {
      background: rgba(12, 22, 35, 0.85);
      border-bottom-left-radius: 10px;
      border-left: 2px solid #2bc0ff;
    }

    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      background: rgba(18, 28, 40, 0.8);
      border-radius: 40px;
      width: fit-content;
    }
    .typing-dot {
      width: 8px;
      height: 8px;
      background: #8bcbff;
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 60%, 100% { transform: scale(0.6); opacity: 0.5; }
      30% { transform: scale(1.1); opacity: 1; }
    }

    .input-area {
      background: rgba(10, 18, 28, 0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(64, 164, 215, 0.3);
      padding: 14px 18px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .input-wrapper {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 44px;
      border: 1px solid rgba(66, 192, 255, 0.5);
      display: flex;
      align-items: center;
      padding: 4px 8px 4px 18px;
    }
    .input-wrapper:focus-within {
      border-color: #3ebcff;
      box-shadow: 0 0 0 2px rgba(62, 188, 255, 0.3);
    }

    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 6px 12px 0;
      font-size: 1rem;
      color: #eff3ff;
      outline: none;
    }
    #userInput::placeholder {
      color: #8fabc3;
    }

    #sendBtn {
      background: linear-gradient(120deg, #1877c2, #0e5a8e);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }
    #sendBtn:active { transform: scale(0.94); }
    #sendBtn svg {
      width: 22px;
      height: 22px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .info-note {
      text-align: center;
      font-size: 0.7rem;
      padding: 8px;
      color: #93b5cf;
      background: rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<div class="ai-container">
  <div class="ai-header">
    <h1>🌀 NANN META AI</h1>
    <div class="badge-version">Gemini 2.0 Flash · Gratis</div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="message bot-message">
      <div class="avatar">🌀</div>
      <div class="bubble">Halo! Saya NANN META AI. Saya pakai Google Gemini (gratis). Tanya apa aja ya! ✨</div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <input type="text" id="userInput" placeholder="Ketik pertanyaan di sini..." autocomplete="off">
    </div>
    <button id="sendBtn">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <div class="info-note">
    🔑 Gratis · Dapatkan API Key di aistudio.google.com
  </div>
</div>

<script>
  // ========== GANTI DENGAN API KEY GEMINI KAMU ==========
  // 🔻🔻🔻 AMBIL API KEY GRATIS DI aistudio.google.com 🔻🔻🔻
  const GEMINI_API_KEY = "AIzaSyDGvOpXSyjdMIqQxCVAuMftFDnb9w-4www";
  
  // Model Gemini gratis terbaru
  const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`;
  
  const chatArea = document.getElementById('chatArea');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  
  let isLoading = false;
  
  function scrollToBottom() {
    setTimeout(() => {
      chatArea.scrollTop = chatArea.scrollHeight;
    }, 50);
  }
  
  function addMessage(role, content) {
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message');
    messageDiv.classList.add(role === 'user' ? 'user-message' : 'bot-message');
    
    const avatarSpan = document.createElement('div');
    avatarSpan.classList.add('avatar');
    avatarSpan.innerText = role === 'user' ? '👤' : '🌀';
    
    const bubbleDiv = document.createElement('div');
    bubbleDiv.classList.add('bubble');
    bubbleDiv.innerHTML = content.replace(/\n/g, '<br>');
    
    messageDiv.appendChild(avatarSpan);
    messageDiv.appendChild(bubbleDiv);
    chatArea.appendChild(messageDiv);
    scrollToBottom();
  }
  
  let typingDiv = null;
  function showTyping() {
    if (typingDiv) typingDiv.remove();
    const loader = document.createElement('div');
    loader.classList.add('message', 'bot-message');
    loader.innerHTML = `<div class="avatar">🌀</div><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    chatArea.appendChild(loader);
    typingDiv = loader;
    scrollToBottom();
  }
  
  function hideTyping() {
    if (typingDiv) {
      typingDiv.remove();
      typingDiv = null;
    }
  }
  
  async function askGemini(question) {
    if (!GEMINI_API_KEY || GEMINI_API_KEY === "AIzaSyDGvOpXSyjdMIqQxCVAuMftFDnb9w-4www") {
      return "⚠️ **API Key belum diisi!** ⚠️\n\nCara dapatkan:\n1. Buka aistudio.google.com\n2. Login pake Gmail\n3. Klik 'Get API Key'\n4. Copy & ganti di kode ini";
    }
    
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: `Kamu adalah NANN META AI, asisten AI yang ramah dan membantu. Gunakan bahasa Indonesia. Jawab pertanyaan berikut: ${question}` }]
          }],
          generationConfig: {
            temperature: 0.7,
            maxOutputTokens: 800,
          }
        })
      });
      
      const data = await response.json();
      
      if (data.error) {
        return `❌ Error API: ${data.error.message}\n\n💡 Solusi: Pastikan API KEY benar dan sudah diaktifkan di Google AI Studio.`;
      }
      
      if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
        return data.candidates[0].content.parts[0].text;
      }
      
      return "Maaf, NANN META AI tidak bisa menjawab saat ini. Coba lagi ya.";
    } catch (error) {
      return `❌ Gagal koneksi ke Gemini:\n${error.message}\n\nCek koneksi internet atau API Key.`;
    }
  }
  
  async function sendMessage() {
    if (isLoading) return;
    const question = userInput.value.trim();
    if (!question) return;
    
    isLoading = true;
    sendBtn.disabled = true;
    userInput.disabled = true;
    
    addMessage('user', question);
    userInput.value = '';
    
    showTyping();
    const answer = await askGemini(question);
    hideTyping();
    addMessage('bot', answer);
    
    isLoading = false;
    sendBtn.disabled = false;
    userInput.disabled = false;
    userInput.focus();
  }
  
  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !isLoading) {
      e.preventDefault();
      sendMessage();
    }
  });
  
  // Pesan peringatan jika API Key masih default
  if (GEMINI_API_KEY === "AIzaSyCVSLAUbqbhocLLeZ2t4DePQFO9V-8YMQM") {
    addMessage('bot', "🔑 **Pertama, kamu harus ganti API Key-nya!**\n\nLangkah:\n1. Buka aistudio.google.com\n2. Login pake email Google\n3. Klik 'Get API Key' → buat & copy\n4. Ganti text `GANTI_DENGAN_API_KEY_GEMINI_ASLI` dengan key asli kamu.\n\nSetelah itu refresh halaman ini dan chat bisa jalan! ✅");
  }
</script>
</body>
</html>
