<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nann Official · Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 30% 20%, #0a0a12, #020205);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .container {
            max-width: 450px;
            width: 100%;
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #e8d5b0, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p {
            color: rgba(255,255,245,0.6);
            font-size: 0.8rem;
        }
        .card {
            background: rgba(10,10,20,0.6);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 2rem;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .tab-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 60px;
            transition: all 0.2s;
            color: rgba(255,255,245,0.6);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #1a1508;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: rgba(255,255,245,0.7);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.9rem;
            border-radius: 60px;
            border: 1px solid rgba(212,175,55,0.4);
            background: rgba(20,20,35,0.8);
            color: white;
            font-size: 0.9rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #d4af37;
        }
        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #1a1508;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: #ff6b6b;
        }
        .info-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: rgba(255,255,245,0.4);
        }
        @media (max-width: 480px) {
            .card { padding: 1.5rem; }
            .logo h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>✨ NANN OFFICIAL ✨</h1>
            <p>Luxury Digital Marketplace</p>
        </div>
        <div class="card">
            <div class="tab-buttons">
                <button class="tab-btn active" id="loginTab">Login</button>
                <button class="tab-btn" id="registerTab">Register</button>
            </div>

            <!-- Form Login -->
            <div id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Masukkan username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Masukkan password">
                </div>
                <button class="btn-submit" id="loginBtn">Login</button>
            </div>

            <!-- Form Register -->
            <div id="registerForm" style="display:none;">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Masukkan username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Masukkan password">
                </div>
                <div class="form-group">
                    <label>Daftar sebagai</label>
                    <select id="regRole">
                        <option value="member">Member</option>
                        <option value="owner">Owner (khusus admin)</option>
                    </select>
                </div>
                <button class="btn-submit" id="registerBtn">Daftar</button>
            </div>

            <div id="message" class="message"></div>
            <div class="info-text">
                <i class="fas fa-shield-alt"></i> Data tersimpan di browser Anda
            </div>
        </div>
    </div>

    <script>
        // ========== INISIALISASI DATA DEFAULT ==========
        function initData() {
            // Default Owner
            if (!localStorage.getItem('users')) {
                const defaultUsers = [
                    { id: 1, username: 'owner', password: btoa('owner123'), role: 'owner', saldo: 0 },
                    { id: 2, username: 'member', password: btoa('member123'), role: 'member', saldo: 50000 }
                ];
                localStorage.setItem('users', JSON.stringify(defaultUsers));
            }
            
            // Default Produk
            if (!localStorage.getItem('products')) {
                const defaultProducts = [
                    { id: 1, name: '🤖 JASA JADI BOT WHATSAPP', price: 1000, category: 'bot', benefits: 'JADI OWNER BOT, BISA OPEN JASA SEWA BOT, PAKE BOT SEPUASNYA, FITUR 1500+, ANTI DELAY' },
                    { id: 2, name: '🎬 ALIGHT MOTION PREMIUM', price: 10000, category: 'alight', benefits: 'AKUN PRIVATE, PREMIUM UNLIMITED, DURASI 1 TAHUN, NO EXPORT WATERMARK, ALL FITUR PRO' },
                    { id: 3, name: '💾 PANEL DYNAN - Kapasitas (1-10GB)', price: 'custom', category: 'kapasitas', benefits: 'FREE INSTALL PANEL, ANTI DELAY' },
                    { id: 4, name: '👑 PANEL DYNAN - Role', price: 'custom', category: 'role', benefits: 'BISA BUAT PANEL SEPUASNYA, PANEL ANTI DELAY' },
                    { id: 5, name: '🥚 NOKOS INDON OLD', price: 10000, category: 'nokos', benefits: 'VERSI OLD LIMITED, PREMIUM ACCESS, STABLE VERSION' },
                    { id: 6, name: '🥚 NOKOS INDON FRESH', price: 6000, category: 'nokos', benefits: 'VERSI FRESH UPDATE, PREMIUM ACCESS, FULL SUPPORT' }
                ];
                localStorage.setItem('products', JSON.stringify(defaultProducts));
            }
            
            // Topup requests
            if (!localStorage.getItem('topup_requests')) {
                localStorage.setItem('topup_requests', JSON.stringify([]));
            }
            
            // Transaksi pembelian
            if (!localStorage.getItem('transactions')) {
                localStorage.setItem('transactions', JSON.stringify([]));
            }
        }
        
        initData();
        
        // Tab切换
        document.getElementById('loginTab').onclick = () => {
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('registerTab').classList.remove('active');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('message').innerHTML = '';
        };
        document.getElementById('registerTab').onclick = () => {
            document.getElementById('registerTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('message').innerHTML = '';
        };
        
        // LOGIN
        document.getElementById('loginBtn').onclick = () => {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                document.getElementById('message').innerHTML = 'Isi username dan password!';
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('users'));
            const user = users.find(u => u.username === username && atob(u.password) === password);
            
            if (!user) {
                document.getElementById('message').innerHTML = 'Username atau password salah!';
                return;
            }
            
            // Simpan session
            localStorage.setItem('currentUser', JSON.stringify({ id: user.id, username: user.username, role: user.role, saldo: user.saldo }));
            
            // Redirect sesuai role
            if (user.role === 'owner') {
                window.location.href = 'owner.html';
            } else {
                window.location.href = 'member.html';
            }
        };
        
        // REGISTER
        document.getElementById('registerBtn').onclick = () => {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            
            if (!username || !password) {
                document.getElementById('message').innerHTML = 'Isi semua field!';
                return;
            }
            
            if (password.length < 4) {
                document.getElementById('message').innerHTML = 'Password minimal 4 karakter!';
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('users'));
            if (users.find(u => u.username === username)) {
                document.getElementById('message').innerHTML = 'Username sudah terdaftar!';
                return;
            }
            
            const newId = users.length + 1;
            const newUser = {
                id: newId,
                username: username,
                password: btoa(password),
                role: role,
                saldo: role === 'owner' ? 0 : 0
            };
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            
            document.getElementById('message').innerHTML = '✅ Registrasi berhasil! Silakan login.';
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            
            setTimeout(() => {
                document.getElementById('loginTab').click();
            }, 1500);
        };
    </script>
</body>
</html>
