<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Owner Dashboard · Nann Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 30% 20%, #0a0a12, #010105);
            color: #f0f0f5;
            padding: 1.2rem;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1rem 1.5rem;
            background: rgba(10,10,20,0.4);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #e8d5b0, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .btn-logout {
            background: rgba(212,175,55,0.2);
            border: 1px solid rgba(212,175,55,0.4);
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            cursor: pointer;
            color: white;
        }
        .stats {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            padding: 1rem 1.5rem;
            border-radius: 36px;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .stat-number { font-size: 1.8rem; font-weight: 700; color: #d4af37; }
        .stat-label { font-size: 0.7rem; }
        
        .section {
            background: rgba(10,10,20,0.4);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .section h2 {
            margin-bottom: 1.2rem;
            font-size: 1.3rem;
            border-left: 3px solid #d4af37;
            padding-left: 1rem;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.8rem;
            text-align: left;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        th { color: #d4af37; }
        
        .btn-small {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 60px;
            cursor: pointer;
            color: #1a1508;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .btn-small.danger { background: #dc2626; color: white; }
        .btn-small.success { background: #22c55e; color: white; }
        
        .form-add {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .form-add input, .form-add textarea {
            padding: 0.7rem 1rem;
            border-radius: 60px;
            border: 1px solid rgba(212,175,55,0.4);
            background: rgba(20,20,35,0.8);
            color: white;
            flex: 1;
        }
        .form-add textarea { flex: 2; min-width: 200px; border-radius: 30px; }
        .form-add button { flex: 0.5; min-width: 100px; }
        
        .message {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 30px;
            text-align: center;
        }
        .message.success { background: rgba(34,197,94,0.2); color: #4ade80; }
        .message.error { background: rgba(220,38,38,0.2); color: #f87171; }
        
        .saldo-input { width: 100px; padding: 0.3rem; border-radius: 30px; border: 1px solid rgba(212,175,55,0.4); background: rgba(20,20,35,0.8); color: white; }
        
        @media (max-width: 768px) {
            .form-add { flex-direction: column; }
            .form-add input, .form-add textarea, .form-add button { width: 100%; }
            table, thead, tbody, th, td, tr { display: block; }
            th { display: none; }
            td { display: flex; justify-content: space-between; padding: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👑 NANN OFFICIAL · OWNER DASHBOARD</h1>
            <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        
        <div class="stats" id="stats"></div>
        
        <!-- TAMBAH PRODUK -->
        <div class="section">
            <h2><i class="fas fa-plus-circle"></i> Tambah Produk Baru</h2>
            <div class="form-add">
                <input type="text" id="productName" placeholder="Nama Produk">
                <input type="number" id="productPrice" placeholder="Harga">
                <textarea id="productBenefit" rows="2" placeholder="Benefit produk (contoh: Fitur A, Fitur B, Garansi)"></textarea>
                <button class="btn-small" id="addProductBtn">➕ Tambah</button>
            </div>
            <div id="addMessage" class="message"></div>
        </div>
        
        <!-- DAFTAR PRODUK -->
        <div class="section">
            <h2><i class="fas fa-box"></i> Daftar Produk</h2>
            <div id="productList"></div>
        </div>
        
        <!-- KONFIRMASI TOPUP -->
        <div class="section">
            <h2><i class="fas fa-upload"></i> Konfirmasi Top Up Member</h2>
            <div id="topupList"></div>
        </div>
        
        <!-- DAFTAR MEMBER -->
        <div class="section">
            <h2><i class="fas fa-users"></i> Daftar Member</h2>
            <div id="memberList"></div>
        </div>
    </div>
    
    <script src="saldo.js"></script>
    <script>
        let currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'owner') window.location.href = 'index.html';
        
        function loadStats() {
            const members = SaldoManager.getAllMembers();
            const products = SaldoManager.getAllProducts();
            const topups = SaldoManager.getAllTopupRequests();
            const pendingTopups = topups.filter(t => t.status === 'pending');
            document.getElementById('stats').innerHTML = `
                <div class="stat-card"><div class="stat-number">${members.length}</div><div class="stat-label">Total Member</div></div>
                <div class="stat-card"><div class="stat-number">${products.length}</div><div class="stat-label">Total Produk</div></div>
                <div class="stat-card"><div class="stat-number">${pendingTopups.length}</div><div class="stat-label">Pending Topup</div></div>
            `;
        }
        
        // TAMBAH PRODUK
        document.getElementById('addProductBtn').onclick = () => {
            const name = document.getElementById('productName').value.trim();
            const price = parseInt(document.getElementById('productPrice').value);
            const benefit = document.getElementById('productBenefit').value.trim();
            if (!name || !price || price <= 0) {
                document.getElementById('addMessage').innerHTML = 'Isi nama dan harga produk yang valid!';
                document.getElementById('addMessage').className = 'message error';
                return;
            }
            const result = SaldoManager.tambahProduk(name, price, benefit);
            document.getElementById('addMessage').innerHTML = result.message;
            document.getElementById('addMessage').className = 'message success';
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productBenefit').value = '';
            loadProducts();
            loadStats();
            setTimeout(() => document.getElementById('addMessage').innerHTML = '', 2000);
        };
        
        function loadProducts() {
            const products = SaldoManager.getAllProducts();
            if (products.length === 0) {
                document.getElementById('productList').innerHTML = '<p style="text-align:center; opacity:0.6;">Belum ada produk. Silakan tambah produk.</p>';
                return;
            }
            let html = '<table><thead><tr><th>Nama Produk</th><th>Harga</th><th>Benefit</th><th>Aksi</th></tr></thead><tbody>';
            products.forEach(p => {
                html += `<tr><td>${p.name}</td><td>Rp ${p.price.toLocaleString('id-ID')}</td><td>${p.benefit.substring(0, 60)}${p.benefit.length > 60 ? '...' : ''}</td><td><button class="btn-small danger" onclick="deleteProduct(${p.id})">Hapus</button></td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('productList').innerHTML = html;
        }
        
        window.deleteProduct = (id) => {
            if (confirm('Yakin ingin menghapus produk ini?')) {
                const result = SaldoManager.hapusProduk(id);
                alert(result.message);
                loadProducts();
                loadStats();
            }
        };
        
        function loadTopupRequests() {
            const topups = SaldoManager.getAllTopupRequests();
            const users = SaldoManager.getUsers();
            const pending = topups.filter(t => t.status === 'pending');
            if (pending.length === 0) {
                document.getElementById('topupList').innerHTML = '<p style="text-align:center; opacity:0.6;">Tidak ada permintaan topup</p>';
                return;
            }
            let html = '<table><thead><tr><th>Member</th><th>Jumlah</th><th>Bukti</th><th>Aksi</th></tr></thead><tbody>';
            pending.forEach(t => {
                const member = users.find(u => u.id === t.user_id);
                html += `<tr><td>${member ? member.username : 'Unknown'}</td><td>Rp ${t.amount.toLocaleString('id-ID')}</td><td>${t.bukti.substring(0, 30)}${t.bukti.length > 30 ? '...' : ''}</td><td><button class="btn-small success" onclick="confirmTopup(${t.id})">Konfirmasi</button></td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('topupList').innerHTML = html;
        }
        
        window.confirmTopup = (id) => {
            const result = SaldoManager.konfirmasiTopup(id);
            alert(result.message);
            loadTopupRequests();
            loadMemberList();
            loadStats();
        };
        
        function loadMemberList() {
            const members = SaldoManager.getAllMembers();
            if (members.length === 0) {
                document.getElementById('memberList').innerHTML = '<p style="text-align:center; opacity:0.6;">Belum ada member yang mendaftar</p>';
                return;
            }
            let html = '<table><thead><tr><th>Username</th><th>Saldo</th><th>Tambah Saldo</th><th>Aksi</th></tr></thead><tbody>';
            members.forEach(m => {
                html += `
                    <tr>
                        <td>${m.username}</td>
                        <td id="saldo_${m.id}">Rp ${m.saldo.toLocaleString('id-ID')}</td>
                        <td>
                            <input type="number" id="input_saldo_${m.id}" class="saldo-input" placeholder="Jumlah">
                            <button class="btn-small" onclick="tambahSaldoMember(${m.id})">Tambah</button>
                        </td>
                        <td><button class="btn-small danger" onclick="hapusMember(${m.id})">Hapus Akun</button></td>
                    </tr>
                `;
            });
            html += '</tbody></table>';
            document.getElementById('memberList').innerHTML = html;
        }
        
        window.tambahSaldoMember = (id) => {
            const amount = parseInt(document.getElementById(`input_saldo_${id}`).value);
            if (!amount || amount <= 0) {
                alert('Masukkan jumlah saldo yang valid!');
                return;
            }
            const result = SaldoManager.tambahSaldo(id, amount);
            alert(result.message);
            if (result.success) {
                document.getElementById(`saldo_${id}`).innerText = `Rp ${result.newSaldo.toLocaleString('id-ID')}`;
                document.getElementById(`input_saldo_${id}`).value = '';
                loadStats();
            }
        };
        
        window.hapusMember = (id) => {
            if (confirm('Yakin ingin menghapus akun member ini? Data tidak dapat dikembalikan.')) {
                const result = SaldoManager.hapusMember(id);
                alert(result.message);
                loadMemberList();
                loadStats();
            }
        };
        
        document.getElementById('logoutBtn').onclick = () => {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        };
        
        loadStats();
        loadProducts();
        loadTopupRequests();
        loadMemberList();
    </script>
</body>
</html>
